<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">{{title}}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()">
  </button>
</div>
<div class="modal-body">
  @if (messageBold) {
    <p class="text-break"><b>{{messageBold}}</b></p>
  }
  @if (message) {
    <p class="mb-0 text-break" [innerHTML]="message"></p>
  }
  @if (showRemoteOcr) {
    <div class="mt-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" id="reprocessRemoteOcrLocal" name="remoteOcrMode" value="local" [(ngModel)]="remoteOcrMode" />
        <label class="form-check-label" for="reprocessRemoteOcrLocal" i18n>Use local OCR</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" id="reprocessRemoteOcrRemote" name="remoteOcrMode" value="remote" [(ngModel)]="remoteOcrMode" />
        <label class="form-check-label" for="reprocessRemoteOcrRemote" i18n>Use remote OCR</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" id="reprocessRemoteOcrConfigured" name="remoteOcrMode" value="configured" [(ngModel)]="remoteOcrMode" />
        <label class="form-check-label" for="reprocessRemoteOcrConfigured" i18n>Follow settings</label>
      </div>
      <div class="form-text" i18n>Follow settings applies the configured remote OCR mode. Choosing remote OCR may incur costs.</div>
    </div>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn" [class]="cancelBtnClass" (click)="cancel()" [disabled]="!buttonsEnabled">
    <span class="d-inline-block" style="padding-bottom: 1px;">{{cancelBtnCaption}}</span>
  </button>
  <button type="button" class="btn" [class]="btnClass" (click)="confirm()" [disabled]="!confirmButtonEnabled || !buttonsEnabled">
    {{btnCaption}}
  </button>
</div>
